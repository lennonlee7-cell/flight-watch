<meta charset="utf-8">

<title>Flight Watch</title>

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231a2a6c'/%3E%3Cstop offset='1' stop-color='%2347b6ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' fill='url(%23g)'/%3E%3Cpath d='M47 29.5 35 23V13.5a3 3 0 0 0-6 0V23l-12 6.5v4l12-3.5v8.5l-4 3v3l7-2 7 2v-3l-4-3V30l12 3.5z' fill='white'/%3E%3C/svg%3E">

<style>
:root {
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --bg: #eef2f9; --card: #ffffff; --ink: #0d1530; --sub: #5f6b85; --faint: #9aa5bd;
  --line: #e4e9f2; --line-2: #cfd7e6; --fill: #f3f6fb;
  --brand: #2d55f5; --brand-soft: #e9eeff; --on-brand: #ffffff;
  --good: #0c8f55; --good-soft: #e1f6ec; --bad: #d93a42; --bad-soft: #fdecee; --warn: #a65d00; --warn-soft: #fff3df;
  --hero: linear-gradient(150deg, #14205a 0%, #2447e8 52%, #3fa9ff 100%);
  --shadow: 0 1px 2px rgba(13,21,48,.05), 0 8px 24px rgba(13,21,48,.06);
  --shadow-lg: 0 2px 4px rgba(13,21,48,.04), 0 16px 40px rgba(20,32,90,.12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070b18; --card: #111833; --ink: #eef2ff; --sub: #9aa6c4; --faint: #5d6888;
    --line: #1d2747; --line-2: #2a365c; --fill: #172040;
    --brand: #6e8dff; --brand-soft: #1a2552; --on-brand: #ffffff;
    --good: #45d48c; --good-soft: #0d2e22; --bad: #ff7076; --bad-soft: #3a1520; --warn: #ffb547; --warn-soft: #34250a;
    --hero: linear-gradient(150deg, #0a1033 0%, #1a35b8 55%, #2a83d6 100%);
    --shadow: 0 0 0 1px rgba(255,255,255,.03); --shadow-lg: 0 0 0 1px rgba(255,255,255,.04), 0 16px 40px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #070b18; --card: #111833; --ink: #eef2ff; --sub: #9aa6c4; --faint: #5d6888;
  --line: #1d2747; --line-2: #2a365c; --fill: #172040;
  --brand: #6e8dff; --brand-soft: #1a2552; --on-brand: #ffffff;
  --good: #45d48c; --good-soft: #0d2e22; --bad: #ff7076; --bad-soft: #3a1520; --warn: #ffb547; --warn-soft: #34250a;
  --hero: linear-gradient(150deg, #0a1033 0%, #1a35b8 55%, #2a83d6 100%);
  --shadow: 0 0 0 1px rgba(255,255,255,.03); --shadow-lg: 0 0 0 1px rgba(255,255,255,.04), 0 16px 40px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); padding-bottom: calc(env(safe-area-inset-bottom) + 28px); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
svg { display: block; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- 頁首 ---------- */
.hero { background: var(--hero); color: #fff; position: relative; overflow: hidden; padding: calc(env(safe-area-inset-top) + 14px) 0 70px; border-radius: 0 0 30px 30px; }
.hero::before { content: ""; position: absolute; width: 340px; height: 340px; right: -120px; top: -150px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.18), transparent); }
.hero .arc { position: absolute; right: -10px; bottom: 18px; width: 230px; height: 90px; opacity: .55; pointer-events: none; }
.bar { display: flex; justify-content: space-between; align-items: center; position: relative; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
.mark { width: 34px; height: 34px; border-radius: 11px; background: rgba(255,255,255,.18); display: grid; place-items: center; backdrop-filter: blur(6px); }
.lang { display: flex; background: rgba(255,255,255,.16); border-radius: 999px; padding: 3px; }
.lang button { border: 0; background: transparent; color: rgba(255,255,255,.8); font-weight: 700; font-size: 13px; padding: 5px 12px; border-radius: 999px; }
.lang button[aria-pressed="true"] { background: #fff; color: #1a2a6c; }
.hero h1 { font-size: 28px; line-height: 1.15; letter-spacing: -.02em; margin: 26px 0 6px; font-weight: 800; max-width: 330px; position: relative; }
.hero-sub { margin: 0; color: rgba(255,255,255,.82); font-size: 14.5px; max-width: 330px; position: relative; }
.pill { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; background: rgba(255,255,255,.14); border-radius: 999px; padding: 6px 12px 6px 10px; font-size: 13px; font-weight: 600; position: relative; max-width: 100%; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #5cf0a2; box-shadow: 0 0 0 3px rgba(92,240,162,.25); flex: none; }
.pill.warn .dot { background: #ffc35c; box-shadow: 0 0 0 3px rgba(255,195,92,.25); }
.pill.bad .dot { background: #ff7a80; box-shadow: 0 0 0 3px rgba(255,122,128,.25); }
.pill.busy .dot { background: #fff; animation: pulse 1.1s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
main.wrap { margin-top: -46px; position: relative; }
.notice { border-radius: 14px; padding: 11px 14px; font-size: 14px; margin: 0 0 12px; font-weight: 600; }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.bad { background: var(--bad-soft); color: var(--bad); }

/* ---------- 登機證卡片 ---------- */
.pass { background: var(--card); border-radius: 24px; box-shadow: var(--shadow-lg); margin: 0 0 18px; overflow: hidden; }
.pass-top { padding: 16px 18px 16px; background: linear-gradient(180deg, var(--brand-soft) 0%, transparent 100%); }
.pass-head { display: flex; align-items: center; gap: 8px; min-height: 34px; }
.kind { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); }
.tagname { font-size: 13px; font-weight: 700; color: var(--ink); background: var(--card); border: 1px solid var(--line); padding: 2px 10px; border-radius: 999px; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--fill); color: var(--sub); }
.ibtn { margin-left: auto; width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); display: grid; place-items: center; flex: none; }
.route { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; margin-top: 10px; }
.ap .code { font-size: 36px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
.ap .city { font-size: 12.5px; color: var(--sub); margin-top: 5px; font-weight: 500; }
.ap.r { text-align: right; }
.path { position: relative; height: 34px; color: var(--brand); }
.path svg.arcl { position: absolute; inset: 0; width: 100%; height: 100%; }
.path .pl { position: absolute; left: 50%; top: -2px; transform: translateX(-50%); background: var(--card); border-radius: 50%; padding: 3px; box-shadow: 0 0 0 1px var(--line); }
.perf { position: relative; border-top: 2px dashed var(--line-2); margin: 2px 20px 0; }
.perf::before, .perf::after { content: ""; position: absolute; top: -12px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); }
.perf::before { left: -32px; } .perf::after { right: -32px; }
.info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 14px 18px 4px; }
.info div { min-width: 0; }
.info .k { font-size: 10.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); }
.info .v { font-size: 14.5px; font-weight: 700; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.info .s { font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.wchips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 18px 2px; scrollbar-width: none; }
.wchips::-webkit-scrollbar, .strip::-webkit-scrollbar { display: none; }
.wc { flex: none; display: flex; align-items: center; gap: 9px; border: 0; background: var(--brand-soft); color: var(--ink); border-radius: 14px; padding: 8px 12px 8px 10px; text-align: left; }
.wc .ic { color: var(--brand); }
.wc .t1 { font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.wc .t2 { font-size: 13px; font-weight: 800; }
.wc .t2.ok { color: var(--good); } .wc .t2.out { color: var(--bad); }

.slabel span { display: inline-block; color: var(--brand); }
.slabel { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--sub); padding: 14px 18px 8px; }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 0 18px 2px; scroll-snap-type: x proximity; scrollbar-width: none; }
.dp { flex: none; scroll-snap-align: start; width: 66px; border: 1.5px solid var(--line); background: var(--card); border-radius: 16px; padding: 8px 4px 9px; text-align: center; line-height: 1.15; }
.dp .wd { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--sub); }
.dp .dn { font-size: 21px; font-weight: 800; margin: 3px 0 1px; }
.dp .mo { font-size: 10.5px; font-weight: 600; color: var(--sub); }
.dp .pr { font-size: 12px; font-weight: 800; margin-top: 6px; color: var(--ink); }
.dp.best .pr { color: var(--good); }
.dp[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--card); }
.dp[aria-pressed="true"] .wd, .dp[aria-pressed="true"] .mo { color: inherit; opacity: .7; }
.dp[aria-pressed="true"] .pr { color: inherit; }
.dp[aria-pressed="true"].best .pr { color: #5cf0a2; }
:root[data-theme="dark"] .dp[aria-pressed="true"].best .pr { color: var(--good); }

.lh { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; padding: 18px 18px 8px; }
.lh h3 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.lh small { display: block; color: var(--sub); font-size: 12.5px; margin-top: 1px; }
.seg { display: inline-flex; background: var(--fill); border-radius: 11px; padding: 3px; flex: none; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--sub); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(13,21,48,.12); }
.filters { display: flex; gap: 8px; padding: 0 18px 6px; }
.fchip { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 700; color: var(--sub); display: inline-flex; align-items: center; gap: 6px; }
.fchip[aria-pressed="true"] { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }

ul.flights { list-style: none; margin: 0; padding: 0 10px 4px; }
.fr { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 12px; row-gap: 6px; padding: 12px 8px; border-radius: 18px; align-items: center; }
.fr + .fr { box-shadow: 0 -1px 0 var(--line); }
.fr.watched { background: var(--brand-soft); box-shadow: none; }
.fr.watched + .fr { box-shadow: none; }
.al { grid-row: 1 / span 2; align-self: start; width: 40px; height: 40px; border-radius: 13px; background: var(--al-bg); color: var(--al-fg); font-size: 13px; font-weight: 800; display: grid; place-items: center; letter-spacing: .02em; }
.tl { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 800; letter-spacing: -.01em; min-width: 0; }
.tl sup { font-size: 10.5px; color: var(--warn); font-weight: 800; margin-left: 1px; }
.tl .ln { flex: 1; min-width: 16px; height: 2px; position: relative; background: repeating-linear-gradient(90deg, var(--line-2) 0 4px, transparent 4px 7px); }
.tl .ln::after { content: ""; position: absolute; left: 50%; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--card); border: 2px solid var(--brand); transform: translateX(-50%); }
.tl .ln.stop::after { border-color: var(--warn); }
.row2 { grid-column: 2 / 4; display: flex; gap: 10px; align-items: center; min-width: 0; }
.fr-sub { flex: 1; font-size: 12.5px; color: var(--sub); min-width: 0; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.fr-sub .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.price { grid-column: 3; grid-row: 1; text-align: right; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
.price .was { display: block; font-size: 11px; font-weight: 600; color: var(--sub); letter-spacing: 0; }
.acts { display: flex; gap: 6px; justify-content: flex-end; align-items: center; flex: none; }
.bell { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--line-2); background: var(--card); color: var(--sub); display: grid; place-items: center; padding: 0; }
.bell[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
.book { display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--ink); color: var(--card); font-size: 13px; font-weight: 800; text-decoration: none; }
.fr.out .tl, .fr.out .price, .fr.out .al { opacity: .45; }
.fr.gone .price .v { text-decoration: line-through; color: var(--faint); }
.b { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px; letter-spacing: .02em; white-space: nowrap; }
.b.new { background: var(--brand-soft); color: var(--brand); }
.b.good { background: var(--good-soft); color: var(--good); }
.b.bad { background: var(--bad-soft); color: var(--bad); }
.b.mute { background: var(--fill); color: var(--sub); }
.fr.watched .b.new, .fr.watched .b.mute { background: var(--card); }

.ret { margin: 6px 12px 10px; border-radius: 20px; background: var(--fill); padding-bottom: 4px; }
.ret .rh { display: flex; align-items: center; gap: 10px; padding: 14px 14px 6px; }
.ret .rh .al { width: 30px; height: 30px; border-radius: 10px; font-size: 11px; grid-row: auto; }
.ret .rh b { font-size: 14.5px; } .ret .rh small { display: block; color: var(--sub); font-size: 12px; }
.ret ul.flights { padding: 0 2px 2px; }
.ret .fr + .fr { box-shadow: 0 -1px 0 var(--line-2); }
.hintbox { margin: 6px 12px 10px; border-radius: 18px; border: 1.5px dashed var(--line-2); padding: 14px 16px; color: var(--sub); font-size: 13.5px; display: flex; gap: 12px; align-items: center; }
.hintbox .ic { width: 34px; height: 34px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; flex: none; }
.empty { padding: 20px 18px; color: var(--sub); font-size: 14px; text-align: center; }
.pf { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 18px 16px; color: var(--sub); font-size: 12.5px; border-top: 1px solid var(--line); margin-top: 6px; }
.gf { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 12px; color: var(--ink); font-weight: 700; font-size: 13px; text-decoration: none; white-space: nowrap; }
.note { padding: 2px 18px 0; font-size: 12px; color: var(--faint); }

.add { width: 100%; border: 2px dashed var(--line-2); background: transparent; border-radius: 22px; padding: 18px; font-weight: 800; font-size: 15px; color: var(--brand); display: flex; gap: 8px; justify-content: center; align-items: center; margin-bottom: 4px; }
.heroCard { background: var(--card); border-radius: 26px; box-shadow: var(--shadow-lg); padding: 26px 22px 22px; text-align: center; }
.heroCard h2 { margin: 14px 0 6px; font-size: 21px; font-weight: 800; letter-spacing: -.01em; }
.heroCard p { margin: 0 auto 18px; color: var(--sub); max-width: 320px; }
.btn { border: 0; border-radius: 14px; padding: 12px 16px; font-weight: 800; font-size: 15px; background: var(--fill); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--brand); color: var(--on-brand); box-shadow: 0 6px 16px rgba(45,85,245,.28); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.block { width: 100%; }

.sect { font-size: 12px; font-weight: 800; color: var(--sub); text-transform: uppercase; letter-spacing: .1em; margin: 28px 6px 10px; }
.card { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; }
.cpad { padding: 18px; }
.ch { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.ch .ic { width: 40px; height: 40px; border-radius: 13px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; flex: none; }
.ch b { font-size: 16px; font-weight: 800; } .ch small { display: block; color: var(--sub); font-size: 13px; }
ol.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
ol.steps li { counter-increment: s; display: flex; gap: 10px; align-items: flex-start; margin: 9px 0; font-size: 14px; }
ol.steps li::before { content: counter(s); width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--card); font-size: 12px; font-weight: 800; display: grid; place-items: center; flex: none; margin-top: 1px; }
.topic { display: flex; align-items: center; gap: 8px; background: var(--fill); border-radius: 14px; padding: 6px 6px 6px 12px; margin: 12px 0 10px; }
.topic code { flex: 1; font: 700 13.5px ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; user-select: all; }
.topic .btn { padding: 8px 12px; font-size: 13px; background: var(--card); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 18px; }
.row + .row { border-top: 1px solid var(--line); }
.row .lab { display: flex; gap: 12px; align-items: center; font-weight: 700; }
.row .lab .ic { width: 32px; height: 32px; border-radius: 10px; background: var(--fill); color: var(--sub); display: grid; place-items: center; flex: none; }
.row .lab small { display: block; font-weight: 500; color: var(--sub); font-size: 12px; }
select.inp, input.inp { border: 1.5px solid var(--line); background: var(--fill); border-radius: 12px; padding: 9px 12px; min-height: 44px; width: 100%; font-size: 16px; font-weight: 600; outline: none; }
.inp:focus { border-color: var(--brand); }
.row select.inp { width: auto; min-width: 110px; }
details.tips summary { list-style: none; cursor: pointer; }
details.tips summary::-webkit-details-marker { display: none; }
details.tips .chev { margin-left: auto; transition: transform .2s; color: var(--faint); }
details.tips[open] .chev { transform: rotate(90deg); }
details.tips .ch { margin: 0; }
details.tips ol { margin-top: 14px; }
.ev { display: grid; grid-template-columns: 14px 1fr; gap: 12px; padding: 12px 18px; }
.ev + .ev { border-top: 1px solid var(--line); }
.ev .d { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); margin-top: 6px; box-shadow: 0 0 0 4px var(--brand-soft); }
.ev time { font-size: 12px; color: var(--faint); font-weight: 600; }
.ev .et { font-weight: 800; font-size: 14.5px; margin-top: 1px; }
.ev .em { white-space: pre-wrap; font-size: 12.5px; color: var(--sub); margin-top: 3px; font-variant-numeric: tabular-nums; }
.foot { text-align: center; font-size: 12.5px; color: var(--sub); margin: 26px auto 0; max-width: 400px; }
.skel { height: 14px; border-radius: 7px; background: var(--fill); margin: 10px 0; animation: pulse 1.4s infinite; }

#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translate(-50%, 16px); background: #0d1530; color: #fff; padding: 11px 18px; border-radius: 14px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: .25s; width: max-content; max-width: calc(100% - 32px); text-align: center; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- 編輯表單（底部抽屜） ---------- */
dialog.sheet { margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92dvh; border: 0; border-radius: 26px 26px 0 0; padding: 0; background: var(--card); color: var(--ink); }
dialog.sheet[open] { animation: up .3s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translateY(48px); opacity: 0; } }
@media (min-width: 620px) { dialog.sheet { margin: auto; border-radius: 26px; } }
dialog::backdrop { background: rgba(7,11,24,.5); }
.sheet-h { position: sticky; top: 0; z-index: 2; background: var(--card); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 8px 10px 10px; border-bottom: 1px solid var(--line); }
.sheet-h::before { content: ""; position: absolute; left: 50%; top: 6px; width: 38px; height: 5px; border-radius: 3px; background: var(--line-2); transform: translateX(-50%); }
.sheet-h h3 { margin: 10px 0 0; font-size: 16px; font-weight: 800; text-align: center; }
.lnk { border: 0; background: transparent; color: var(--brand); font-weight: 600; font-size: 16px; padding: 12px 8px 2px; }
.lnk:first-child { justify-self: start; } .lnk.strong { justify-self: end; font-weight: 800; }
.sheet-b { padding: 14px 16px calc(24px + env(safe-area-inset-bottom)); }
.err { color: var(--bad); background: var(--bad-soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.err:empty { display: none; }
.seg.big { display: flex; width: 100%; padding: 4px; border-radius: 14px; }
.seg.big button { flex: 1; padding: 9px; font-size: 14.5px; border-radius: 10px; }
.od { display: grid; grid-template-columns: 1fr 44px 1fr; gap: 8px; align-items: center; margin-top: 14px; }
.apin { display: block; border: 1.5px solid var(--line); border-radius: 18px; padding: 10px 14px 11px; background: var(--fill); cursor: text; }
.apin:focus-within { border-color: var(--brand); }
.apin .k { font-size: 10.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--sub); }
.apin input { display: block; width: 100%; border: 0; outline: none; background: transparent; padding: 2px 0 0; font-size: 28px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; }
.apin .city { font-size: 12px; color: var(--sub); min-height: 1.3em; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.swap { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); color: var(--brand); display: grid; place-items: center; padding: 0; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.quick button { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 11px; font-size: 13px; font-weight: 700; color: var(--sub); }
fieldset.grp { border: 0; margin: 20px 0 0; padding: 0; min-width: 0; }
fieldset.grp legend { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--sub); padding: 0; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fl label, .fl .lbl { display: block; font-size: 12px; font-weight: 700; color: var(--sub); margin: 0 0 5px; }
.fl + .fl, .two + .fl, .fl + .two, .two + .two { margin-top: 10px; }
.two > .fl + .fl { margin-top: 0; }
.swrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; font-weight: 700; }
.sw { position: relative; width: 52px; height: 32px; flex: none; }
.sw input { opacity: 0; width: 0; height: 0; position: absolute; }
.sw span { position: absolute; inset: 0; background: var(--line-2); border-radius: 999px; transition: .2s; }
.sw span::after { content: ""; position: absolute; width: 28px; height: 28px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
.sw input:checked + span { background: var(--good); }
.sw input:checked + span::after { transform: translateX(20px); }
.sw input:focus-visible + span { outline: 2px solid var(--brand); outline-offset: 2px; }
.stepper { display: flex; align-items: center; border: 1.5px solid var(--line); background: var(--fill); border-radius: 12px; min-height: 44px; }
.stepper button { border: 0; background: transparent; width: 44px; height: 42px; font-size: 20px; font-weight: 700; color: var(--brand); }
.stepper output { flex: 1; text-align: center; font-weight: 800; font-size: 16px; }
.money-in { position: relative; }
.money-in span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--sub); font-weight: 700; font-size: 15px; pointer-events: none; }
.money-in input { padding-left: 42px; }
.meter { margin-top: 20px; }
.meter .mb { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.meter .mb i { display: block; height: 100%; border-radius: 3px; background: var(--brand); transition: width .2s; }
.meter.over .mb i { background: var(--bad); }
.meter small { display: block; margin-top: 6px; color: var(--sub); font-size: 12.5px; }
.meter.over small { color: var(--bad); font-weight: 700; }
.sheet-acts { display: flex; gap: 10px; margin-top: 18px; }
.sheet-acts .btn { flex: 1; }
@media (max-width: 360px) { .ap .code { font-size: 30px; } .tl { font-size: 16px; } .price { font-size: 16px; } .dp { width: 60px; } }
</style>

}
const money = (p, cur = S.draft?.currency || "SGD") => (p == null ? "—" : (SYM[cur] || cur + " ") + Number(p).toLocaleString("en-US"));
const todaySG = () => new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(new Date());
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 864e5);
function ymd(iso) { const [y, m, d] = iso.split("-").map(Number); return { y, m, d, wd: new Date(Date.UTC(y, m - 1, d)).getUTCDay() }; }
const fmtDay = (iso) => { const x = ymd(iso); return LANG === "zh" ? `${x.m}/${x.d}（${t("wd")[x.wd]}）` : `${t("wd")[x.wd]} ${x.d} ${t("mon")[x.m - 1]}`; };
const fmtShort = (iso) => { const x = ymd(iso); return LANG === "zh" ? `${x.m}/${x.d}` : `${x.d} ${t("mon")[x.m - 1]}`; };
function fmtRange(a, b) {
  if (a === b) return fmtShort(a);
  const x = ymd(a), y = ymd(b);
  if (LANG === "zh") return `${x.m}/${x.d}–${y.m === x.m ? "" : y.m + "/"}${y.d}`;
  return x.m === y.m ? `${x.d}–${y.d} ${t("mon")[y.m - 1]}` : `${x.d} ${t("mon")[x.m - 1]} – ${y.d} ${t("mon")[y.m - 1]}`;
}
const fmtDur = (m) => { const h = Math.floor(m / 60), r = m % 60; return LANG === "zh" ? `${h} 小時${r ? ` ${r} 分` : ""}` : `${h}h${r ? ` ${r}m` : ""}`; };
const clock = (iso) => new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: TZ }).format(new Date(iso));
function ago(iso) {

}
const recent = (iso, h = 24) => iso && Date.now() - Date.parse(iso) < h * 36e5;
const mins = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
function inWin(dep, win) { const a = mins(win[0]), b = mins(win[1]), x = mins(dep); return a <= b ? a <= x && x <= b : x >= a || x <= b; }
const anyWin = (a, b) => a === "00:00" && b === "23:59";
const city = (c) => AIRPORTS[c]?.[LANG === "zh" ? 1 : 0] || "";

// ---------- 行程規劃（和 Mac mini 的 phase1／phase2 同一套規則） ----------
function daysRange(a, b) { const out = []; for (let d = a > todaySG() ? a : todaySG(); d <= b; d = addDays(d, 1)) out.push(d); return out; }
const outDays = (w) => daysRange(w.date_from, w.date_to);
const retDays = (w) => (w.trip === "round" ? daysRange(w.ret_from, w.ret_to) : []);
const outPins = (w) => w.pinned.filter((p) => !p.includes(">")).map((p) => p.split("|"));
function phase1(w) {
  if (w.trip !== "round") return outDays(w).map((d) => d);
  const rs = retDays(w), o = [];
  for (const d of outDays(w)) for (const r of rs) if (r >= d) o.push(`${d}~${r}`);
  return o;
}
function phase2(w) {
  if (w.trip !== "round") return [];
  const ods = new Set(outDays(w)), rs = retDays(w), o = [];
  for (const [d, k] of outPins(w)) if (ods.has(d)) for (const r of rs) if (r >= d) o.push(`${d}~${r}~${k}`);
  return o;
}
const queryCount = (w) => (w.enabled ? phase1(w).length + phase2(w).length : 0);
const totalQueries = (ws) => ws.reduce((n, w) => n + queryCount(w), 0);
const winOut = (w) => [w.time_from, w.time_to];
const winRet = (w) => [w.ret_time_from || "00:00", w.ret_time_to || "23:59"];
function cheapest(fl, win) {
  let best = null;
  for (const f of fl || []) if (!f.gone && f.p != null && inWin(f.dep, win) && (best == null || f.p < best)) best = f.p;
  return best;
}

};
const defaultCfg = () => ({ v: 0, currency: "SGD", lang: "en", interval: 60, watches: [] });

function normalize(cfg) {
  for (const w of cfg.watches) {
    w.trip = w.trip === "round" ? "round" : "oneway";
    w.pinned = Array.isArray(w.pinned) ? w.pinned : [];
  }
  return cfg;
}

async function pollTopic(topic, since) {
  const r = await fetch(`${NTFY}/${topic}/json?poll=1&since=${since}`, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  return (await r.text()).split("\n").filter(Boolean).map((l) => { try { return JSON.parse(l); } catch { return null; } })
    .filter((m) => m && m.event === "message").sort((a, b) => a.time - b.time);
}
async function msgBody(m) {
  if (m.attachment) {
    if (m.attachment.expires && m.attachment.expires * 1000 < Date.now()) return null;
    return (await fetch(m.attachment.url, { cache: "no-store" })).json();
  }
  return JSON.parse(m.message);
}
async function latest(topic, since) {
  const msgs = await pollTopic(topic, since);
  for (let i = msgs.length - 1; i >= 0; i--) {
    try { const b = await msgBody(msgs[i]); if (b && typeof b === "object") return b; } catch {}
  }
  return null;
}

async function refresh() {
  if (!T) return;
  let st = null, pend = null;
  try { [st, pend] = await Promise.all([latest(T.st, "3h"), latest(T.cfg, "12h").catch(() => null)]); } catch { st = null; }
  if (st) { S.status = st; store.set("fw-last", JSON.stringify(st)); }
  else if (!S.status) { try { S.status = JSON.parse(store.get("fw-last")); S.status && (S.status._cached = true); } catch {} }
  const base = S.status?.cfg, engineV = base?.v || 0;
  if (pend && pend.v > engineV && pend.v > S.pendingV && pend.v !== S.status?.cfg_error_v) S.pendingV = pend.v;
  if (S.pendingV && engineV >= S.pendingV) { toast(t("applied")); S.pendingV = 0; }
  if (S.pendingV && S.status?.cfg_error_v === S.pendingV) S.pendingV = 0; // Mac mini 退件，回到它手上的版本
  if (!S.dirty && !S.saving) {
    if (!S.pendingV) S.draft = normalize(clone(base || defaultCfg()));
    else if (!S.draft || (S.draft.v || 0) < S.pendingV) S.draft = pend && pend.v === S.pendingV ? normalize(clone(pend)) : S.draft;
  }
  if (!S.draft) S.draft = normalize(clone(base || defaultCfg()));
  S.loaded = true;
  render();
  clearTimeout(refresh.tm);
  refresh.tm = setTimeout(refresh, S.pendingV ? 12000 : 60000);
}

async function save() {
  clearTimeout(S.timer);
  const cfg = { ...clone(S.draft), v: Date.now() };
  S.saving = true; renderPill();
  try {
    const r = await fetch(`${NTFY}/${T.cfg}`, { method: "POST", body: JSON.stringify(cfg) });
    if (!r.ok) throw new Error(r.status);
    S.draft.v = cfg.v; S.pendingV = cfg.v; S.dirty = false;
    toast(t("sent"));
    clearTimeout(refresh.tm); refresh.tm = setTimeout(refresh, 8000);
  } catch {
    S.dirty = true; toast(t("saveFail"));
  }
  S.saving = false; render();
}

function renderPill() {
  const pill = $("#pill"), txt = pill.lastElementChild, st = S.status;
  let cls = "", msg;
  if (!T) { cls = "bad"; msg = t("noKey"); }
  else if (S.saving || S.dirty) { cls = "busy"; msg = t("unsaved"); }
  else if (!S.loaded) { cls = "busy"; msg = t("connecting"); }
  else if (!st) { cls = "bad"; msg = t("offline"); }
  else if (st._cached || Date.now() - Date.parse(st.t) > 90 * 6e4) { cls = "warn"; msg = t("stale", { ago: ago(st.t) }); }
  else if (S.pendingV) { cls = "busy"; msg = t("applying"); }
  else if (!st.last) { msg = t("waitingFirst"); }
  else { msg = t("live", { ago: ago(st.last), next: clock(st.next) }); }
  pill.className = "pill " + cls; txt.textContent = msg;
  const n = [];

  if (st && st.cfg_error && !S.pendingV) n.push(`<div class="notice bad">${esc(t("rejected", { err: st.cfg_error }))}</div>`);

function stopsText(f) {

// 一行航班。kind: one（單程）、out（來回的去程）、ret（來回的回程）
function flightRow(w, lk, f, kind) {
  const [d, r, k0] = lk.split("~");
  const key = kind === "ret" ? `${d}|${k0}>${r}|${f.k}` : `${d}|${f.k}`;
  const watched = w.pinned.includes(key), win = inWin(f.dep, kind === "ret" ? winRet(w) : winOut(w));
  const noPrice = f.gone && f.low == null;
  const b = [];
  if (f.gone) b.push(`<span class="b ${noPrice ? "mute" : "bad"}">${esc(t(noPrice ? "badgeNoPrice" : "badgeGone"))}</span>`);
  else {
    if (recent(f.back)) b.push(`<span class="b good">${esc(t("badgeBack"))}</span>`);
    else if (!f.init && recent(f.first)) b.push(`<span class="b new">${esc(t("badgeNew"))}</span>`);
    if (recent(f.chg) && f.prev != null && f.p != null && f.prev !== f.p) {
      const dd = f.p - f.prev;
      b.push(`<span class="b ${dd < 0 ? "good" : "bad"}">${dd < 0 ? "↓" : "↑"} ${esc(money(Math.abs(dd)))}</span>`);
    }
  }
  const was = !f.gone && f.low != null && f.p != null && f.low < f.p ? `<span class="was">${esc(t("lowWas", { p: money(f.low) }))}</span>` : "";
  const book = (kind !== "out" && !f.gone && bookingUrl(f.bk))
    ? `<a class="book" href="${esc(bookingUrl(f.bk))}" target="_blank" rel="noopener">${esc(t("book"))}</a>` : "";
  return `<li class="fr${win ? "" : " out"}${f.gone ? " gone" : ""}${watched ? " watched" : ""}">
    <div class="al" style="${alStyle(alCode(f.k))}">${esc(alCode(f.k))}</div>
    <div class="tl num">${esc(f.dep)}<span class="ln${f.stops ? " stop" : ""}"></span>${esc(f.arr)}${f.plus ? `<sup>+${f.plus}</sup>` : ""}</div>
    <div class="price num"><span class="v">${f.gone && noPrice ? "—" : esc(money(f.p))}</span>${was}</div>
    <div class="row2"><div class="fr-sub"><span class="nm">${esc(f.al)} · ${esc(f.k.replace(/\+/g, " + "))}</span><span>${esc(fmtDur(f.dur))} · ${esc(stopsText(f))}</span>${b.join("")}</div>
    <div class="acts">${book}<button class="bell" data-act="pin" data-w="${esc(w.id)}" data-key="${esc(key)}" aria-pressed="${watched}" aria-label="${esc(t("watching"))} ${esc(f.k)}">${IC.bell(17)}</button></div></div>
  </li>`;
}

function listBlock(w, lk, kind, fl) {
  if (!fl) {
    const err = S.status?.res?.[w.id]?.err?.[lk];
    return `<div class="empty">${esc(err ? t("dayErr", { e: err }) : t(kind === "ret" ? "retChecking" : "notChecked"))}</div>`;
  }
  let rows = fl.slice();
  const win = kind === "ret" ? winRet(w) : winOut(w);
  if (S.onlyWin[w.id]) rows = rows.filter((f) => inWin(f.dep, win));
  if (S.sort === "price") rows.sort((a, b) => (!!a.gone - !!b.gone) || ((a.p ?? 1e12) - (b.p ?? 1e12)));
  if (!rows.length) return `<div class="empty">${esc(t(S.onlyWin[w.id] ? "noneInWin" : "noFlights"))}</div>`;
  return `<ul class="flights">${rows.map((f) => flightRow(w, lk, f, kind)).join("")}</ul>`;
}

function datePill(w, which, d, price, sel, best) {

}
function strip(w, which, days, priceOf, sel) {
  const vals = days.map((d) => priceOf(d));
  const nums = vals.filter((v) => typeof v === "number");
  const min = nums.length ? Math.min(...nums) : null;
  return `<div class="strip" data-s="${esc(w.id)}-${which}">${days.map((d, i) =>
    datePill(w, which, d, typeof vals[i] === "number" ? money(vals[i]) : vals[i], sel, nums.length > 1 && vals[i] === min)).join("")}</div>`;
}
function dayPrice(res, lk, win) {
  const dd = res?.days?.[lk];
  if (dd) { const c = cheapest(dd.fl, win); return c == null ? "—" : c; }
  return res?.err?.[lk] ? "!" : "…";
}

function watchChips(w, res) {
  const out = [];
  for (const [d, k] of outPins(w)) {
    let best = null, seen = null;
    const lks = w.trip === "round" ? retDays(w).filter((r) => r >= d).map((r) => `${d}~${r}`) : [d];
    for (const lk of lks) {
      const f = res?.days?.[lk]?.fl?.find((x) => x.k === k);
      if (f) { seen = seen || f; if (!f.gone && f.p != null && (!best || f.p < best.p)) best = f; }
    }
    const f = best || seen, ok = !!best;
    const price = f ? (ok ? (w.trip === "round" && LANG !== "zh" ? "from " : "") + money(best.p) : t(f.low == null ? "badgeNoPrice" : "badgeGone")) : "…";
    out.push(`<button class="wc" data-act="dep" data-w="${esc(w.id)}" data-d="${esc(d)}"><span class="ic">${IC.bell(16)}</span>
      <span><div class="t1">${esc(k)} · ${esc(fmtShort(d))}</div><div class="t2 ${f ? (ok ? "ok" : "out") : ""} num">${esc(price)}</div></span></button>`);
  }
  for (const p of w.pinned.filter((x) => x.includes(">"))) {
    const [[d, k], [r, k2]] = p.split(">").map((x) => x.split("|"));
    const f = res?.days?.[`${d}~${r}~${k}`]?.fl?.find((x) => x.k === k2);
    const ok = f && !f.gone && f.p != null;
    out.push(`<button class="wc" data-act="pair" data-w="${esc(w.id)}" data-d="${esc(d)}" data-r="${esc(r)}"><span class="ic">${IC.bell(16)}</span>
      <span><div class="t1">${esc(k)} + ${esc(k2)} · ${esc(fmtShort(d))}–${esc(fmtShort(r))}</div><div class="t2 ${f ? (ok ? "ok" : "out") : ""} num">${f ? esc(ok ? money(f.p) : t(f.low == null ? "badgeNoPrice" : "badgeGone")) : "…"}</div></span></button>`);
  }
  return out.length ? `<div class="wchips">${out.join("")}</div>` : "";
}

function pickSel(w, res) {
  const ods = outDays(w), sel = S.sel[w.id] || {};
  let d = sel.d, r = sel.r;
  if (!ods.includes(d)) {
    d = S.focus.w === w.id && ods.includes(S.focus.d) ? S.focus.d
      : ods.find((x) => Object.keys(res?.days || {}).some((lk) => lk.split("~")[0] === x)) || ods[0];
    r = S.focus.w === w.id ? S.focus.r : null;
  }
  if (w.trip === "round") {
    const rs = retDays(w).filter((x) => x >= d);
    if (!rs.includes(r)) r = rs.find((x) => res?.days?.[`${d}~${x}`]) || rs[0];
  } else r = null;
  return (S.sel[w.id] = { d, r });
}

function tripCard(w) {
  const res = S.status?.res?.[w.id], ods = outDays(w);
  const kind = w.trip === "round" ? t("roundTrip") : t("oneWay");
  const top = `<div class="pass-top">
      <div class="pass-head"><span class="kind">${esc(kind)}</span>${w.name ? `<span class="tagname">${esc(w.name)}</span>` : ""}${w.enabled ? "" : `<span class="tag">${esc(t("paused"))}</span>`}
        <button class="ibtn" data-act="edit" data-w="${esc(w.id)}" aria-label="${esc(t("editTrip"))}">${IC.edit(17)}</button></div>
      <div class="route">
        <div class="ap"><div class="code">${esc(w.from)}</div><div class="city">${esc(city(w.from))}</div></div>
        <div class="path"><svg class="arcl" viewBox="0 0 100 34" preserveAspectRatio="none" fill="none"><path d="M2 30 Q50 -4 98 30" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/></svg>
          <span class="pl" style="${w.trip === "round" ? "" : "transform:translateX(-50%) rotate(90deg)"}">${w.trip === "round" ? svg('<path d="M7 7h11l-3-3M17 17H6l3 3"/>', 16) : IC.plane(16)}</span></div>
        <div class="ap r"><div class="code">${esc(w.to)}</div><div class="city">${esc(city(w.to))}</div></div>
      </div></div><div class="perf"></div>`;
  const info = [`<div><div class="k">${esc(t("depart"))}</div><div class="v">${esc(fmtRange(w.date_from, w.date_to))}</div><div class="s">${esc(anyWin(w.time_from, w.time_to) ? t("anyTime") : `${w.time_from}–${w.time_to}`)}</div></div>`];
  if (w.trip === "round") info.push(`<div><div class="k">${esc(t("ret"))}</div><div class="v">${esc(fmtRange(w.ret_from, w.ret_to))}</div><div class="s">${esc(anyWin(...winRet(w)) ? t("anyTime") : winRet(w).join("–"))}</div></div>`);
  info.push(`<div><div class="k">${esc(t("target"))}</div><div class="v num">${esc(w.max_price ? money(w.max_price) : t("none"))}</div><div class="s">${esc([w.nonstop ? t("nonstop") : t("upTo1"), w.adults > 1 ? t("adultsN", { n: w.adults }) : t("adult1")].join(" · "))}</div></div>`);
  const head = `<section class="pass" id="trip-${esc(w.id)}">${top}<div class="info">${info.join("")}</div>`;
  if (!ods.length) return `${head}<div class="empty">${esc(t("ePast"))}</div></section>`;

  const { d, r } = pickSel(w, res);
  let body = watchChips(w, res);
  let lkOut;
  if (w.trip === "round") {
    const rsAll = retDays(w);
    body += `<div class="slabel"><span style="transform:rotate(90deg)">${IC.plane(13)}</span> ${esc(t("depart"))}</div>` + strip(w, "dep", ods, (x) => {
      const vals = rsAll.filter((y) => y >= x).map((y) => dayPrice(res, `${x}~${y}`, winOut(w))).filter((v) => typeof v === "number");
      return vals.length ? Math.min(...vals) : (rsAll.some((y) => y >= x && res?.days?.[`${x}~${y}`]) ? "—" : "…");
    }, d);
    body += `<div class="slabel"><span style="transform:rotate(-90deg)">${IC.plane(13)}</span> ${esc(t("ret"))}</div>`
      + strip(w, "ret", rsAll.filter((y) => y >= d), (y) => dayPrice(res, `${d}~${y}`, winOut(w)), r);
    lkOut = `${d}~${r}`;
  } else {
    body += `<div class="slabel"><span style="transform:rotate(90deg)">${IC.plane(13)}</span> ${esc(t("depart"))}</div>` + strip(w, "dep", ods, (x) => dayPrice(res, x, winOut(w)), d);
    lkOut = d;
  }
  const round = w.trip === "round";
  body += `<div class="lh"><div><h3>${esc(t(round ? "outTitle" : "oneTitle"))}</h3><small>${esc(t(round ? "outCap" : "oneCap"))}</small></div>
    <div class="seg" role="group"><button data-act="sort" data-v="time" aria-pressed="${S.sort === "time"}">${esc(t("sortTime"))}</button><button data-act="sort" data-v="price" aria-pressed="${S.sort === "price"}">${esc(t("sortPrice"))}</button></div></div>
    <div class="filters"><button class="fchip" data-act="win" data-w="${esc(w.id)}" aria-pressed="${!!S.onlyWin[w.id]}">${IC.clock(14)} ${esc(t("myTimes"))}</button></div>`;
  const outList = res?.days?.[lkOut]?.fl;
  body += listBlock(w, lkOut, round ? "out" : "one", outList);

  if (round && r) {
    const mine = outPins(w).filter(([x]) => x === d).map(([, k]) => k);
    if (!mine.length) body += `<div class="hintbox"><span class="ic">${IC.bell(17)}</span><span>${esc(t("pickOut"))}</span></div>`;
    for (const k of mine) {
      const of = outList?.find((x) => x.k === k);
      const lk = `${d}~${r}~${k}`;
      body += `<div class="ret"><div class="rh"><div class="al" style="${alStyle(alCode(k))}">${esc(alCode(k))}</div>
        <div><b>${esc(t("retTitle", { d: fmtDay(r) }))}</b><small>${esc(t("retCap", { k, dep: of ? of.dep : "" }))}</small></div></div>
        ${listBlock(w, lk, "ret", res?.days?.[lk]?.fl)}</div>`;
    }
  }
  const dd = res?.days?.[lkOut];
  const gUrl = res?.url?.[lkOut], okUrl = /^https:\/\/www\.google\.com\/travel\/flights/.test(gUrl || "");
  body += `<div class="pf"><span>${dd ? esc(t("checked", { ago: ago(dd.checked) })) : ""}</span>${okUrl ? `<a class="gf" href="${esc(gUrl)}" target="_blank" rel="noopener">${esc(t("google"))} ${IC.ext(14)}</a>` : ""}</div>`;
  return `${head}${body}</section>`;
}

  const app = $("#app");
  if (!T) {
    app.innerHTML = `<section class="heroCard"><div style="color:var(--brand);display:grid;place-items:center">${svg('<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/>', 44)}</div><h2>${esc(t("noKey"))}</h2><p>${esc(t("noKeyMsg"))}</p></section>`;
    return;
  }
  if (!S.draft) return;
  const scroll = {};
  app.querySelectorAll(".strip, .wchips").forEach((el, i) => { scroll[el.dataset.s || `c${i}`] = el.scrollLeft; });
  const ws = S.draft.watches;
  const trips = ws.length ? ws.map(tripCard).join("") + `<button class="add" data-act="add">${IC.plus(18)} ${esc(t("addTrip"))}</button>`
    : emptyCard();
  const hint = ws.length && !ws.some((w) => w.pinned.length) ? `<p class="note" style="margin:10px 4px 0;padding:0">${esc(t("watchHint"))}</p>` : "";
  app.innerHTML = trips + hint + notifCard() + settingsCard() + eventsCard();
  app.querySelectorAll(".strip").forEach((el) => {
    if (scroll[el.dataset.s] != null) el.scrollLeft = scroll[el.dataset.s];
    else { const on = el.querySelector('[aria-pressed="true"]'); if (on) el.scrollLeft = Math.max(0, on.offsetLeft - 18); }
  });
  if (S.focus.w && !render.focused && S.status) {

    if (el) { render.focused = true; el.scrollIntoView({ block: "start" }); }
  }
}

function togglePin(w, key) {
  const before = w.pinned.slice(), i = w.pinned.indexOf(key);
  if (i >= 0) w.pinned = w.pinned.filter((p) => p !== key && !p.startsWith(key + ">")); // 取消去程也一併取消它的回程
  else w.pinned.push(key);
  if (totalQueries(S.draft.watches) > MAX_QUERIES) { w.pinned = before; toast(t("eBudget")); return; }
  saveSoon(); render();
}

$("#app").addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "SELECT") return;
  const act = el.dataset.act, w = el.dataset.w ? findW(el.dataset.w) : null;
  if (act === "pin") togglePin(w, el.dataset.key);
  else if (act === "dep") { S.sel[w.id] = { d: el.dataset.d, r: S.sel[w.id]?.r }; render(); }
  else if (act === "ret") { S.sel[w.id] = { d: S.sel[w.id].d, r: el.dataset.d }; render(); }
  else if (act === "pair") { S.sel[w.id] = { d: el.dataset.d, r: el.dataset.r }; render(); }
  else if (act === "sort") { S.sort = el.dataset.v; store.set("fw-sort", S.sort); render(); }
  else if (act === "win") { S.onlyWin[w.id] = !S.onlyWin[w.id]; render(); }
  else if (act === "edit") openEditor(w);
  else if (act === "add") openEditor(null);
  else if (act === "copy") {
    try { await navigator.clipboard.writeText(T.main); toast(t("copied")); }
    catch { const rg = document.createRange(); rg.selectNodeContents($("#topicName")); getSelection().removeAllRanges(); getSelection().addRange(rg); }
  } else if (act === "test") {
    try {
      const r = await fetch(NTFY, { method: "POST", body: JSON.stringify({ topic: T.main, title: t("testTitle"), message: t("testMsg"), tags: ["white_check_mark"] }) });
      toast(r.ok ? t("testSent") : t("saveFail"));
    } catch { toast(t("saveFail")); }
  }
});

    ret_time_from: round ? $("#fRT0").value : null, ret_time_to: round ? $("#fRT1").value : null,
    nonstop: $("#fNonstop").checked, max_price: Number($("#fMax").value) > 0 ? Math.round(Number($("#fMax").value)) : null,
    adults: fAdults, seat: $("#fSeat").value, enabled: $("#fEnabled").checked, pinned: editing ? editing.pinned.slice() : [],
  };
  if (editing && (editing.from !== w.from || editing.to !== w.to || editing.trip !== w.trip)) w.pinned = [];
  const inOut = (d) => d >= w.date_from && d <= w.date_to, inRet = (d) => round && d >= w.ret_from && d <= w.ret_to;
  w.pinned = w.pinned.filter((p) => {
    const [[d], ret] = p.split(">").map((x) => x.split("|"));
    return inOut(d) && (!ret || inRet(ret[0]));
  });
  return w;
}
function searchTotal(w) {
  const ok = w.date_from && w.date_to && w.date_from <= w.date_to && (w.trip !== "round" || (w.ret_from && w.ret_to && w.ret_from <= w.ret_to));
  return S.draft.watches.filter((x) => x.id !== w.id).reduce((n, x) => n + queryCount(x), 0) + (ok ? queryCount(w) : 0);
}
function updateMeter() {
  if (!dlg.open && !editing && !$("#fD0").value) return;
  const n = searchTotal(formWatch()), box = $("#fMeter");
  box.classList.toggle("over", n > MAX_QUERIES);
  box.querySelector("i").style.width = Math.min(100, (n / MAX_QUERIES) * 100) + "%";
  box.querySelector("small").textContent = t("meter", { n, max: MAX_QUERIES });
}
function validate(w) {
  if (!/^[A-Z]{3}$/.test(w.from) || !/^[A-Z]{3}$/.test(w.to)) return t("eAirport");
  if (w.from === w.to) return t("eSame");
  const ranges = [[w.date_from, w.date_to]].concat(w.trip === "round" ? [[w.ret_from, w.ret_to]] : []);
  for (const [a, b] of ranges) {
    if (!a || !b) return t("eDates");
    if (b < a) return t("eOrder");
    if (daysBetween(a, b) > 30) return t("eSpan");
  }
  if (w.date_to < todaySG()) return t("ePast");
  if (w.trip === "round" && w.ret_to < w.date_from) return t("eRetBefore");
  if (!w.time_from || !w.time_to || (w.trip === "round" && (!w.ret_time_from || !w.ret_time_to))) return t("eTime");
  const n = searchTotal(w);
  if (n > MAX_QUERIES) return t("eQueries", { n, max: MAX_QUERIES });
  return null;
}
$("#fSave").addEventListener("click", () => {
  const w = formWatch(), err = validate(w);
  if (err) { $("#fErr").textContent = err; dlg.querySelector(".sheet-b").scrollTop = 0; dlg.scrollTop = 0; return; }
  const i = S.draft.watches.findIndex((x) => x.id === w.id);
  if (i >= 0) S.draft.watches[i] = w; else S.draft.watches.push(w);
  S.sel[w.id] = null; S.focus = { w: w.id, d: null, r: null }; render.focused = false;
  dlg.close(); save();
});
$("#fDelete").addEventListener("click", () => {
  if (!editing || !confirm(t("confirmDelete"))) return;
  S.draft.watches = S.draft.watches.filter((x) => x.id !== editing.id);
  dlg.close(); save();
});
$("#fReturn").addEventListener("click", () => {
  const w = editing; dlg.close();
  const d0 = addDays(w.date_to, 5);
  openEditor(null, { ...w, name: t("returnName"), from: w.to, to: w.from, date_from: d0, date_to: addDays(d0, daysBetween(w.date_from, w.date_to)), pinned: [] });
});

render();
refresh();
</script>
